<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clube do Fausto has moved</title>
<meta name="robots" content="noindex">
<script>
  (function () {
    var target = "https://clube-do-fausto.pages.dev/" + location.search + location.hash;
    var done = false;
    function go() { if (!done) { done = true; location.replace(target); } }
    var jobs = [];
    if ("serviceWorker" in navigator) {
      jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
    }
    if (window.caches) { jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })); }
    Promise.all(jobs).then(go, go);
    setTimeout(go, 1500);
  })();
</script>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4efe6; color: #1f2a44; font: 17px/1.5 Georgia, serif; text-align: center; padding: 16px; box-sizing: border-box; }
  a { color: #a0522d; }
</style>
</head>
<body>
  <p>Clube do Fausto has moved to <a id="go" href="https://clube-do-fausto.pages.dev/">clube-do-fausto.pages.dev</a> 🐾</p>
  <script>document.getElementById("go").href = "https://clube-do-fausto.pages.dev/" + location.search + location.hash;</script>
</body>
</html>
